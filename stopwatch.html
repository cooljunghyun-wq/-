<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOFOTI 해피 스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#bfe6ff;
    --pink:#ffc4dd;
    --console:#c9b8ff;
    --console-dark:#a893f0;
    --cream:#fff8ec;
    --btn-pink:#ff8fab;
    --btn-pink-dark:#ff5c8a;
    --btn-yellow:#ffd66b;
    --btn-yellow-dark:#f0b93a;
    --brown:#6b4226;
    --brown-soft:#8a6142;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    background:linear-gradient(160deg, var(--sky) 0%, #d9f2ff 35%, var(--pink) 100%);
    font-family:'Jua', sans-serif;
    color:var(--brown);
    overflow-x:hidden;
    position:relative;
  }

  /* ===== floating background decor ===== */
  .floaty{
    position:fixed; z-index:0; pointer-events:none;
    opacity:.75; font-size:28px;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{ transform:translateY(10vh) rotate(0deg); opacity:0; }
    10%{ opacity:.8; }
    90%{ opacity:.8; }
    100%{ transform:translateY(-110vh) rotate(25deg); opacity:0; }
  }

  /* ===== console body (Nintendo-ish handheld) ===== */
  .console{
    position:relative; z-index:2;
    width:360px;
    max-width:92vw;
    padding:22px 20px 24px;
    border-radius:38px 38px 46px 46px;
    background:linear-gradient(160deg, var(--console), var(--console-dark));
    border:4px solid #fff;
    box-shadow:
      0 22px 0 -6px rgba(107,66,38,.18),
      0 30px 50px rgba(107,66,38,.25),
      inset 0 2px 0 rgba(255,255,255,.6);
  }

  .top-bar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .led{
    width:10px; height:10px; border-radius:50%;
    background:#7dffb0;
    box-shadow:0 0 8px 2px rgba(125,255,176,.9);
    animation: blink 1.6s ease-in-out infinite;
  }
  .led.on{ background:#ff8a8a; box-shadow:0 0 10px 3px rgba(255,138,138,.9); }
  @keyframes blink{ 0%,100%{ opacity:1;} 50%{ opacity:.4;} }
  .brand{
    font-size:12px; letter-spacing:1px; color:#fff;
    text-shadow:0 1px 0 rgba(107,66,38,.3);
  }

  /* ===== mascot dog peeking over the top edge ===== */
  .mascot-wrap{
    display:flex; justify-content:center;
    margin-top:-52px; margin-bottom:-8px;
    position:relative; z-index:3;
  }
  .mascot{
    width:104px; height:96px;
    animation: bob 2.4s ease-in-out infinite;
    transform-origin:bottom center;
  }
  .mascot.running{ animation: bobFast .5s ease-in-out infinite; }
  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(-2deg); }
    50%{ transform:translateY(-5px) rotate(2deg); }
  }
  @keyframes bobFast{
    0%,100%{ transform:translateY(0) rotate(-4deg); }
    50%{ transform:translateY(-8px) rotate(4deg); }
  }
  .ear{ transform-origin:top center; animation: earWiggle 2.4s ease-in-out infinite; }
  .mascot.running .ear{ animation: earWiggle .5s ease-in-out infinite; }
  .ear.right{ animation-delay:.15s; }
  @keyframes earWiggle{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(8deg); }
  }
  .tongue{ transform-origin:top center; animation: tongueWag 1.2s ease-in-out infinite; }
  @keyframes tongueWag{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(6deg); }
  }

  /* ===== screen ===== */
  .screen-frame{
    background:linear-gradient(180deg, #efe3ff, #ffffff);
    border-radius:22px;
    padding:6px;
    box-shadow: inset 0 2px 6px rgba(107,66,38,.2);
    margin-bottom:16px;
  }
  .screen{
    background:var(--cream);
    border-radius:16px;
    padding:16px 14px 10px;
    border:3px solid #fff;
    box-shadow: inset 0 0 0 2px rgba(255,214,107,.5);
  }
  .status-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:11px; color:var(--brown-soft); letter-spacing:.5px;
    margin-bottom:6px;
  }
  .display-wrap{ text-align:center; margin-bottom:6px; }
  .display{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:48px;
    line-height:1;
    letter-spacing:1px;
    font-variant-numeric: tabular-nums;
    color:var(--btn-pink-dark);
    text-shadow: 2px 2px 0 #fff, 0 0 12px rgba(255,143,171,.35);
  }
  .display .ms{ font-size:22px; opacity:.75; }
  .display.pop{ animation: pop .18s ease; }
  @keyframes pop{
    0%{ transform:scale(1); }
    50%{ transform:scale(1.08); }
    100%{ transform:scale(1); }
  }

  .laps{
    max-height:110px;
    overflow-y:auto;
    margin-top:6px;
  }
  .laps::-webkit-scrollbar{ width:5px; }
  .laps::-webkit-scrollbar-thumb{ background:var(--btn-pink); border-radius:3px; }
  .lap-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 10px;
    margin-bottom:5px;
    border-radius:10px;
    background:#fff;
    border:2px solid #ffe3ee;
    font-size:12px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    color:var(--brown);
    font-variant-numeric: tabular-nums;
    animation: popIn .25s ease;
  }
  .lap-item .tag{ color:var(--btn-pink-dark); font-family:'Jua', sans-serif; font-size:11px; }
  @keyframes popIn{
    from{ opacity:0; transform:translateY(-6px) scale(.95); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* ===== controls ===== */
  .controls{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 6px 10px;
  }
  .dpad{
    position:relative;
    width:70px; height:70px;
    flex-shrink:0;
  }
  .dpad .bar{
    position:absolute;
    background:linear-gradient(180deg,#fff, #f1eaff);
    border-radius:6px;
    box-shadow:0 3px 0 rgba(107,66,38,.25);
  }
  .dpad .bar.v{ width:24px; height:70px; left:23px; top:0; }
  .dpad .bar.h{ width:70px; height:24px; left:0; top:23px; }
  .dpad .paw{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-size:18px;
  }

  .ab-buttons{
    display:flex; align-items:flex-end; gap:14px;
  }
  .btn-round{
    border:none;
    border-radius:50%;
    width:58px; height:58px;
    font-family:'Jua', sans-serif;
    font-size:13px;
    color:#fff;
    cursor:pointer;
    position:relative;
    transition: transform .1s ease, box-shadow .15s ease, opacity .2s ease;
  }
  .btn-round:active{ transform:translateY(3px); }
  .btn-round:disabled{ opacity:.4; cursor:not-allowed; }

  #startStopBtn{
    width:70px; height:70px; font-size:22px;
    background:linear-gradient(160deg, var(--btn-pink), var(--btn-pink-dark));
    box-shadow:0 6px 0 #d94d78, 0 10px 18px rgba(255,92,138,.4);
  }
  #startStopBtn.running{
    background:linear-gradient(160deg, #ffb37a, #ff8a4d);
    box-shadow:0 6px 0 #e06a2a, 0 10px 18px rgba(255,138,77,.45);
  }
  #startStopBtn:active{ box-shadow:0 2px 0 #d94d78; }

  #lapBtn{
    background:linear-gradient(160deg, var(--btn-yellow), var(--btn-yellow-dark));
    box-shadow:0 6px 0 #d69a1f, 0 8px 14px rgba(240,185,58,.4);
    color:var(--brown);
  }
  #lapBtn:active{ box-shadow:0 2px 0 #d69a1f; }

  .bottom-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:4px;
  }
  #resetBtn{
    border:none;
    border-radius:100px;
    padding:8px 18px;
    font-family:'Jua', sans-serif;
    font-size:12px;
    color:var(--brown);
    background:#fff;
    box-shadow:0 4px 0 #d8cdf0;
    cursor:pointer;
    transition: transform .1s ease, opacity .2s ease;
  }
  #resetBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #d8cdf0; }
  #resetBtn:disabled{ opacity:.4; cursor:not-allowed; }
  .cart-label{
    font-size:10px; color:#fff; letter-spacing:.5px; opacity:.85;
  }

  /* burst emoji */
  .burst{
    position:fixed; top:0; left:0;
    font-size:18px; z-index:5; pointer-events:none;
  }
</style>
</head>
<body>
  <div class="console">
    <div class="top-bar">
      <span class="led" id="led"></span>
      <span class="brand">KOFOTI 홍보자산실 ⌒◡⌒</span>
      <span></span>
    </div>

    <div class="mascot-wrap">
      <svg class="mascot" id="mascot" viewBox="0 0 160 150" xmlns="http://www.w3.org/2000/svg">
        <ellipse class="ear left" cx="34" cy="55" rx="24" ry="32" fill="#c98a4b" transform="rotate(-25 34 55)"/>
        <ellipse class="ear right" cx="126" cy="55" rx="24" ry="32" fill="#c98a4b" transform="rotate(25 126 55)"/>
        <ellipse cx="34" cy="58" rx="12" ry="18" fill="#ffdcb0" transform="rotate(-25 34 58)"/>
        <ellipse cx="126" cy="58" rx="12" ry="18" fill="#ffdcb0" transform="rotate(25 126 58)"/>
        <ellipse cx="80" cy="85" rx="58" ry="52" fill="#f3c17f"/>
        <path d="M50 108 Q80 138 110 108 Q100 128 80 128 Q60 128 50 108 Z" fill="#fff8ec"/>
        <circle cx="58" cy="78" r="7" fill="#3a2418"/>
        <circle cx="102" cy="78" r="7" fill="#3a2418"/>
        <circle cx="60.5" cy="75.5" r="2.2" fill="#fff"/>
        <circle cx="104.5" cy="75.5" r="2.2" fill="#fff"/>
        <ellipse cx="42" cy="94" rx="9" ry="6" fill="#ff9fb8" opacity=".7"/>
        <ellipse cx="118" cy="94" rx="9" ry="6" fill="#ff9fb8" opacity=".7"/>
        <ellipse cx="80" cy="96" rx="8" ry="6" fill="#3a2418"/>
        <path d="M80 102 Q80 112 70 112" stroke="#3a2418" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M80 102 Q80 112 90 112" stroke="#3a2418" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path class="tongue" d="M78 112 Q80 126 86 114 Q83 124 78 112 Z" fill="#ff7a95"/>
      </svg>
    </div>

    <div class="screen-frame">
      <div class="screen">
        <div class="status-row">
          <span>🐾 HAPPY TIME</span>
          <span id="lapCountLabel">0 LAPS</span>
        </div>
        <div class="display-wrap">
          <div class="display" id="display">00:00<span class="ms">.00</span></div>
        </div>
        <div class="laps" id="laps"></div>
      </div>
    </div>

    <div class="controls">
      <div class="dpad">
        <div class="bar v"></div>
        <div class="bar h"></div>
        <span class="paw">🐾</span>
      </div>
      <div class="ab-buttons">
        <button id="lapBtn" class="btn-round" disabled>LAP</button>
        <button id="startStopBtn" class="btn-round">▶</button>
      </div>
    </div>

    <div class="bottom-row">
      <button id="resetBtn" disabled>↺ RESET</button>
      <span class="cart-label">HAPPY WATCH v1.0</span>
    </div>
  </div>

<script>
  let startTime = 0;
  let elapsed = 0;
  let rafId = null;
  let running = false;
  let lapCount = 0;

  const display = document.getElementById('display');
  const startStopBtn = document.getElementById('startStopBtn');
  const lapBtn = document.getElementById('lapBtn');
  const resetBtn = document.getElementById('resetBtn');
  const laps = document.getElementById('laps');
  const lapCountLabel = document.getElementById('lapCountLabel');
  const mascot = document.getElementById('mascot');
  const led = document.getElementById('led');

  const decorEmojis = ['🐾','💕','⭐','☁️','🎀'];
  function seedBackground(){
    for(let i=0;i<14;i++){
      const el = document.createElement('span');
      el.className = 'floaty';
      el.textContent = decorEmojis[i % decorEmojis.length];
      el.style.left = Math.random()*100 + 'vw';
      el.style.fontSize = (16 + Math.random()*22) + 'px';
      el.style.animationDuration = (10 + Math.random()*10) + 's';
      el.style.animationDelay = (Math.random()*10) + 's';
      document.body.appendChild(el);
    }
  }
  seedBackground();

  function format(ms) {
    const totalMs = Math.floor(ms);
    const minutes = Math.floor(totalMs / 60000);
    const seconds = Math.floor((totalMs % 60000) / 1000);
    const centis = Math.floor((totalMs % 1000) / 10);
    const pad = (n) => String(n).padStart(2, '0');
    return { main: `${pad(minutes)}:${pad(seconds)}`, ms: pad(centis) };
  }

  function render() {
    const { main, ms } = format(elapsed);
    display.innerHTML = `${main}<span class="ms">.${ms}</span>`;
  }

  function tick() {
    elapsed = performance.now() - startTime;
    render();
    rafId = requestAnimationFrame(tick);
  }

  function start() {
    running = true;
    startTime = performance.now() - elapsed;
    rafId = requestAnimationFrame(tick);
    startStopBtn.textContent = '⏸';
    startStopBtn.classList.add('running');
    lapBtn.disabled = false;
    resetBtn.disabled = false;
    mascot.classList.add('running');
    led.classList.add('on');
  }

  function stop() {
    running = false;
    cancelAnimationFrame(rafId);
    startStopBtn.textContent = '▶';
    startStopBtn.classList.remove('running');
    lapBtn.disabled = true;
    mascot.classList.remove('running');
    led.classList.remove('on');
    display.classList.add('pop');
    setTimeout(() => display.classList.remove('pop'), 200);
  }

  function reset() {
    elapsed = 0;
    lapCount = 0;
    render();
    laps.innerHTML = '';
    resetBtn.disabled = true;
    lapCountLabel.textContent = '0 LAPS';
  }

  function burstHearts(x, y) {
    const emojis = ['💕','⭐','🐾','✨'];
    for (let i = 0; i < 10; i++) {
      const el = document.createElement('div');
      el.className = 'burst';
      el.textContent = emojis[i % emojis.length];
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.body.appendChild(el);
      const angle = (Math.PI * 2 * i) / 10;
      const dist = 50 + Math.random() * 50;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      el.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) scale(.6)`, opacity: 0 }
      ], { duration: 650 + Math.random() * 250, easing: 'ease-out' });
      setTimeout(() => el.remove(), 950);
    }
  }

  startStopBtn.addEventListener('click', () => {
    running ? stop() : start();
  });

  lapBtn.addEventListener('click', () => {
    lapCount++;
    const { main, ms } = format(elapsed);
    const item = document.createElement('div');
    item.className = 'lap-item';
    item.innerHTML = `<span class="tag">LAP ${lapCount}</span><span>${main}.${ms}</span>`;
    laps.prepend(item);
    lapCountLabel.textContent = `${lapCount} LAPS`;
    const rect = lapBtn.getBoundingClientRect();
    burstHearts(rect.left + rect.width / 2, rect.top);
  });

  resetBtn.addEventListener('click', () => {
    if (!running) reset();
  });

  render();
</script>
</body>
</html>
